# Docs check (spec 006, contracts/docs-check.md): commands, repo paths, pinned versions and
# token-like strings in the operator docs. No secrets; read-only.
name: docs-check

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - ".claude/skills/**"
      - "pilot/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check the docs (D1–D4, internal/cli/docs_test.go)
        run: go test -count=1 -run 'TestDocsCheck' -v ./internal/cli
