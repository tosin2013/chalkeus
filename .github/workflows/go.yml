# Pilot CI (spec 016, research R15): vet, lint, vulnerability check, tests (golden audit, shared
# vectors and the docs check included), coverage summary, the in-image Python scripts' tests,
# cross-builds. Read-only; no secrets.
name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install spec (pinned, checksum-verified; the gate's status tool)
        run: |
          set -euo pipefail
          . <(grep -E '^SPEC_(VERSION|SHA256)=' pilot/pins.env)
          cd "$(mktemp -d)"
          base="https://github.com/tosin2013/spec-status/releases/download/v${SPEC_VERSION}"
          curl -fsSLO "$base/spec_${SPEC_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/spec_${SPEC_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "spec_${SPEC_VERSION}_checksums.txt"
          tar -xzf "spec_${SPEC_VERSION}_linux_amd64.tar.gz"
          cp */spec ./spec && echo "${SPEC_SHA256}  spec" | sha256sum -c -
          install -m 0755 spec "$HOME/.local/bin/spec" 2>/dev/null || { mkdir -p "$HOME/.local/bin"; install -m 0755 spec "$HOME/.local/bin/spec"; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test (with coverage)
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out ./... | tee test.out
      - name: Coverage floor (spec 025)
        run: |
          set -euo pipefail
          fail=0
          while read -r pkg floor; do
            case "$pkg" in ''|'#'*) continue;; esac
            got=$(awk -v p="github.com/tosin2013/specfoundry/$pkg" '$0 ~ "(^|[ \t])" p "[ \t]" && /coverage:/ {for (i = 1; i <= NF; i++) if ($i == "coverage:") {sub(/%/, "", $(i + 1)); print $(i + 1)}}' test.out)
            if [ -z "$got" ]; then echo "::error::$pkg: no coverage in the test output"; fail=1; continue; fi
            if awk -v g="$got" -v f="$floor" 'BEGIN {exit !(g < f)}'; then
              echo "::error::$pkg coverage ${got}% is below its floor ${floor}% (.github/coverage-floor.txt)"; fail=1
            else
              echo "$pkg ${got}% (floor ${floor}%)"
            fi
          done < .github/coverage-floor.txt
          exit $fail
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.out ] && [ -f test.out ] || exit 0
          {
            echo "### Go test coverage"
            echo
            echo "Total: $(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}') of statements"
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            awk '/coverage: [0-9.]+% of statements/ {for (i = 1; i <= NF; i++) { if ($i ~ /^github.com\//) p = $i; if ($i == "coverage:") c = $(i + 1) }; sub(/^github.com\/tosin2013\/specfoundry\//, "", p); print "| " p " | " c " |"}' test.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the pilot through its shim
        run: pilot/pilot version
      - name: Tests of the in-image Python scripts (worker, tools, grading)
        run: python3 -m unittest discover -s pilot/images/tests -t pilot/images/tests

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/pilot
