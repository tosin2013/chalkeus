# Domain-allowlisting egress proxy (research R4). Rendered once per proxy by `pilot up`.
#   pilot-egress-model: pilot-egress-model (clients: role=worker) or pilot-egress-scm (clients: role=publisher)
apiVersion: v1
kind: Namespace
metadata: {name: pilot-egress-model, labels: {chalkeus.io/role: egress}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: proxy, namespace: pilot-egress-model}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: proxy-config, namespace: pilot-egress-model}
data:
  tinyproxy.conf: |
    # Rendered into a ConfigMap by `pilot up`. Only CONNECT to 443 on allowlisted hosts.
    Port 8888
    Listen 0.0.0.0
    Timeout 600
    MaxClients 20
    LogLevel Connect
    Syslog Off
    DisableViaHeader Yes
    ConnectPort 443
    Filter "/etc/pilot-proxy/allowlist"
    FilterType ere
    FilterURLs Off
    FilterDefaultDeny Yes
    FilterCaseSensitive Off
  allowlist: |
    ^api\.example\.com$
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: proxy, namespace: pilot-egress-model}
spec:
  replicas: 1
  selector: {matchLabels: {app: proxy}}
  template:
    metadata: {labels: {app: proxy}}
    spec:
      serviceAccountName: proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10003, runAsGroup: 10003, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: img@sha256:x
          ports: [{containerPort: 8888}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          volumeMounts: [{name: config, mountPath: /etc/pilot-proxy}, {name: tmp, mountPath: /tmp}]
      volumes:
        - {name: config, configMap: {name: proxy-config}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: proxy, namespace: pilot-egress-model}
spec:
  selector: {app: proxy}
  ports: [{port: 8888, targetPort: 8888}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: proxy, namespace: pilot-egress-model}
spec:
  podSelector: {matchLabels: {app: proxy}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {chalkeus.io/role: worker}}
      ports: [{protocol: TCP, port: 8888}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0, except: [192.168.0.0/16, 10.96.0.0/12]}
      ports: [{protocol: TCP, port: 443}]
